# EasyPassword 双端发布构建
# 触发：推送 v* 版本标签时，自动构建 Windows EXE 安装包与 Android APK
name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============ Android APK ============
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build APK
        # 仅构建 arm64-v8a 单 ABI 包，显著减小体积（与 build.gradle.kts 的 abiFilters 双保险）
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        # 将 APK 命名为 EasyPassword-{版本号}.apk，与 Windows 安装包命名对齐
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp build/app/outputs/flutter-apk/app-release.apk "EasyPassword-${VERSION}.apk"
          echo "APK renamed to EasyPassword-${VERSION}.apk"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: EasyPassword-*.apk
          fail_on_unmatched_files: false

  # ============ Windows EXE ============
  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install NSIS
        run: choco install nsis -y

      - name: Package installer
        shell: bash
        run: |
          set -e
          # 从 tag 中提取版本号（v1.2.3 -> 1.2.3）
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # 定位 makensis（choco 安装路径随版本变化，逐个探测）
          echo "=== 探测 makensis ==="
          command -v makensis || true
          ls "/c/ProgramData/chocolatey/bin/" 2>/dev/null | grep -i nsis || true
          ls "/c/Program Files (x86)/NSIS/" 2>/dev/null || true
          MAKENSIS="$(command -v makensis 2>/dev/null || true)"
          if [ -z "$MAKENSIS" ]; then
            for p in "/c/Program Files (x86)/NSIS/makensis.exe" \
                     "/c/Program Files/NSIS/makensis.exe" \
                     "/c/Program Files (x86)/NSIS/bin/makensis.exe" \
                     "/c/ProgramData/chocolatey/bin/makensis.exe"; do
              if [ -f "$p" ]; then MAKENSIS="$p"; break; fi
            done
          fi
          if [ -z "$MAKENSIS" ]; then
            echo "::error::makensis not found"
            exit 1
          fi
          echo "using makensis: $MAKENSIS"
          # 注意：用 -VERSION 而非 /VERSION，避免 Git Bash 将 /VERSION 当作路径转换
          "$MAKENSIS" -VERSION
          echo "=== 开始打包 ==="
          # NSIS 的 File /r 仅对绝对 Windows 路径可靠；OutFile 也须绝对路径
          # （相对路径会被解析到脚本所在目录 installers/ 下）
          RELEASE_DIR="$(cygpath -w "$GITHUB_WORKSPACE/build/windows/x64/runner/Release")"
          OUTPUT_EXE="$(cygpath -w "$GITHUB_WORKSPACE/dist/EasyPassword-Setup-$VERSION.exe")"
          mkdir -p dist
          echo "release dir: $RELEASE_DIR"
          echo "output: $OUTPUT_EXE"
          "$MAKENSIS" -DVERSION="$VERSION" -DAPP_NAME="EasyPassword" \
            -DOUTPUT="$OUTPUT_EXE" \
            -DSOURCE="$RELEASE_DIR" \
            installers/windows.nsi
          ls -la dist/

      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EasyPassword-Setup-*.exe
          fail_on_unmatched_files: false
