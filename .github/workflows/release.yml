# EasyPassword 双端发布构建
# 触发：推送 v* 版本标签时，自动构建 Windows EXE 安装包与 Android APK
name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============ Android APK ============
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: false

  # ============ Windows EXE ============
  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install NSIS
        run: choco install nsis -y

      - name: Package installer
        shell: bash
        run: |
          set -e
          # 从 tag 中提取版本号（v1.2.3 -> 1.2.3）
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          makensis -DVERSION="$VERSION" -DAPP_NAME="EasyPassword" \
            -DOUTPUT="dist/EasyPassword-Setup-$VERSION.exe" \
            -DSOURCE="build/windows/x64/runner/Release" \
            installers/windows.nsi

      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EasyPassword-Setup-*.exe
          fail_on_unmatched_files: false
