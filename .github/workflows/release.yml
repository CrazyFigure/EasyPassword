# EasyPassword 双端发布构建
# 触发：推送 v* 版本标签时，自动构建 Windows EXE 安装包与 Android APK
name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============ Android APK ============
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve release version
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::发布标签必须使用 v主版本.次版本.修订号，例如 v0.2.1"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Run tests
        run: flutter test

      - name: Decode release keystore
        # 从 Secrets 还原签名密钥库，保证每次发版使用同一个密钥，
        # 否则用户无法在旧版本之上覆盖安装（签名不一致）
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 Secret，无法进行正式签名"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "keystore 已还原"

      - name: Build APK
        # 仅构建 arm64-v8a 单 ABI 包，显著减小体积（与 build.gradle.kts 的 abiFilters 双保险）
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          flutter build apk --release --target-platform android-arm64
          --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER"
          --dart-define="APP_VERSION=$VERSION"

      - name: Verify APK signature
        # 硬校验产物证书指纹，杜绝静默回退到 debug 签名导致用户无法覆盖安装。
        # 指纹与 android/app/upload-keystore.jks 中的 easypassword 别名一一对应，
        # 若将来更换密钥库，此处必须同步更新。
        env:
          EXPECTED_SHA256: '07:F8:BB:97:AE:B5:7F:1C:6B:67:9D:9D:9B:E8:14:46:83:3B:A1:14:A8:42:54:7E:2A:7B:1E:1A:6F:18:44:EB'
        run: |
          set -e
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -n1)"
          echo "使用 apksigner: $APKSIGNER"
          CERTS="$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          echo "$CERTS"
          # apksigner 输出的指纹为无分隔小写十六进制，需与期望值归一化后比较
          EXPECTED_NORM="$(echo "$EXPECTED_SHA256" | tr -d ':' | tr 'A-Z' 'a-z')"
          if echo "$CERTS" | tr -d ' ' | tr 'A-Z' 'a-z' | grep -q "sha-256digest:$EXPECTED_NORM"; then
            echo "✅ 签名证书校验通过"
          else
            echo "::error::APK 签名证书与预期不符，可能回退到了 debug 签名，已中止发布"
            exit 1
          fi

      - name: Rename APK
        # 将 APK 命名为 EasyPassword-{版本号}.apk，与 Windows 安装包命名对齐
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "EasyPassword-${VERSION}.apk"
          echo "APK renamed to EasyPassword-${VERSION}.apk"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: EasyPassword-*.apk
          fail_on_unmatched_files: false

  # ============ Windows EXE ============
  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve release version
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::发布标签必须使用 v主版本.次版本.修订号，例如 v0.2.1"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: >-
          flutter build windows --release --build-name "$env:VERSION"
          --build-number "$env:GITHUB_RUN_NUMBER"
          --dart-define="APP_VERSION=$env:VERSION"

      - name: Install NSIS
        run: choco install nsis -y

      - name: Package installer
        shell: bash
        run: |
          set -e
          mkdir -p dist
          # 定位 makensis（choco 安装路径随版本变化，逐个探测）
          echo "=== 探测 makensis ==="
          command -v makensis || true
          ls "/c/ProgramData/chocolatey/bin/" 2>/dev/null | grep -i nsis || true
          ls "/c/Program Files (x86)/NSIS/" 2>/dev/null || true
          MAKENSIS="$(command -v makensis 2>/dev/null || true)"
          if [ -z "$MAKENSIS" ]; then
            for p in "/c/Program Files (x86)/NSIS/makensis.exe" \
                     "/c/Program Files/NSIS/makensis.exe" \
                     "/c/Program Files (x86)/NSIS/bin/makensis.exe" \
                     "/c/ProgramData/chocolatey/bin/makensis.exe"; do
              if [ -f "$p" ]; then MAKENSIS="$p"; break; fi
            done
          fi
          if [ -z "$MAKENSIS" ]; then
            echo "::error::makensis not found"
            exit 1
          fi
          echo "using makensis: $MAKENSIS"
          # 注意：用 -VERSION 而非 /VERSION，避免 Git Bash 将 /VERSION 当作路径转换
          "$MAKENSIS" -VERSION
          echo "=== 开始打包 ==="
          # NSIS 的 File /r 仅对绝对 Windows 路径可靠；OutFile 也须绝对路径
          # （相对路径会被解析到脚本所在目录 installers/ 下）
          RELEASE_DIR="$(cygpath -w "$GITHUB_WORKSPACE/build/windows/x64/runner/Release")"
          OUTPUT_EXE="$(cygpath -w "$GITHUB_WORKSPACE/dist/EasyPassword-Setup-$VERSION.exe")"
          mkdir -p dist
          echo "release dir: $RELEASE_DIR"
          echo "output: $OUTPUT_EXE"
          # 传绝对 Windows 路径的图标给 makensis，避免其进程 CWD 与脚本基准不一致
          # 导致 "installers\installer.ico" 相对路径解析失败
          ICON_EXE="$(cygpath -w "$GITHUB_WORKSPACE/installers/installer.ico")"
          echo "icon: $ICON_EXE"
          "$MAKENSIS" -DVERSION="$VERSION" -DAPP_NAME="EasyPassword" \
            -DOUTPUT="$OUTPUT_EXE" \
            -DSOURCE="$RELEASE_DIR" \
            -DMUI_ICON_PATH="$ICON_EXE" \
            installers/windows.nsi
          ls -la dist/

      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EasyPassword-Setup-*.exe
          fail_on_unmatched_files: false
