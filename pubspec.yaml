name: easypassword
description: "EasyPassword - 保存与查看密码的跨平台应用（Android + Windows）"
publish_to: "none"
version: 0.2.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Material/Cupertino 本地化代理用于把输入框长按菜单显示为中文。
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  cryptography: ^2.7.0
  http: ^1.2.2
  url_launcher: ^6.3.0
  win32_registry: ^3.0.3
  # AI 识别页选取本地图片。这里用官方 file_selector 而非 file_picker：
  # file_picker 依赖 win32 ^5.x，与 win32_registry 3.x 要求的 win32 ^6.x 冲突，
  # 而 file_selector 的 Windows 端是原生 C++ 实现，不引入 win32 Dart 包。
  # Android 端走系统 Photo Picker/SAF，同样无需存储权限。
  file_selector: ^1.0.3
  pinyin: 3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# 降级 path_provider_android：2.3.x 引入 jni 插件，在未开启开发者模式的
# Windows 环境无法创建插件符号链接；2.2.x 使用传统 channel，双端均可正常构建
dependency_overrides:
  path_provider_android: 2.2.17

flutter:
  uses-material-design: true
